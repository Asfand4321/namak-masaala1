<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – Namak Masaala</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="namak-logo.png" type="image/png">
</head>
<body>
  <!-- SIMPLE NAVBAR -->
  <header class="navbar">
    <div class="container nav-inner">
      <div class="nav-left">
        <a href="login.html" class="brand-link">
          <div class="logo-mark">
            <img src="namak-logo.png" alt="Namak Masaala logo">
          </div>
          <div class="brand-text">
            <span class="brand-name">Namak Masaala</span>
            <span class="brand-tagline">Home-made Tiffin</span>
          </div>
        </a>
      </div>
      <div class="nav-auth">
        <a href="login.html" class="btn btn-outline">Login</a>
        <a href="signup.html" class="btn btn-primary">Sign up</a>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container auth-layout">
        <div class="card auth-card">
          <div class="section-kicker">Welcome back</div>
          <h1 class="section-title" style="font-size:1.5rem;margin-bottom:8px;">
            Login to continue
          </h1>
          <p class="section-subtitle">
            Please sign in with your email and password. Later this will connect to the real backend.
          </p>

          <form id="login-form" class="auth-form">
            <div class="form-field">
              <label for="loginEmail">Email *</label>
              <input
                id="loginEmail"
                type="email"
                required
                placeholder="you@example.com">
            </div>

            <div class="form-field">
              <label for="loginPassword">Password *</label>
              <input
                id="loginPassword"
                type="password"
                required
                placeholder="••••••••">
            </div>

            <p id="login-error" class="form-error" style="display:none;"></p>

            <button type="submit" class="btn btn-primary btn-full">
              Login
            </button>

            <p class="form-switch">
              Don’t have an account?
              <a href="signup.html">Create one</a>.
            </p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>© 2025 Namak Masaala. All rights reserved.</div>
    </div>
  </footer>

  <script>
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      loginError.style.display = 'none';
      loginError.textContent = '';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        loginError.textContent = 'Please enter your email and password.';
        loginError.style.display = 'block';
        return;
      }

      // TODO: yahin backend (Supabase) call ayega

      // Temporary front-end login
      localStorage.setItem('nm_logged_in', '1');
      localStorage.setItem('nm_user_email', email);

      // login ke baad home page
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
